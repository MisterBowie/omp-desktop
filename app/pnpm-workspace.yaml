packages:
  - apps/*
  - packages/*
  - docs
# pnpm defaults to `lowest-direct`, which makes a plain `pnpm update` resolve
# every range to its floor — silently downgrading dependencies instead of
# refreshing them. Pin the intent: `pnpm update` means "newest within range".
resolutionMode: highest
allowBuilds:
  electron: true
  esbuild: true
  '@google/genai': true
  protobufjs: true
  electron-winstaller: true
  node-pty: true
# Advisory fixes for transitives whose parents still resolve the vulnerable
# version. Drop each one once its parent ships a release that resolves the
# patched version on its own.
overrides:
  # Tailwind's CSS optimizer in 4.3.3 emits a false warning for the valid
  # Custom Highlight API selector `::highlight()`. The parser fix ships in
  # lightningcss 1.33.0.
  '@tailwindcss/node>lightningcss': 1.33.0
  # Ships in the app. mermaid allows ^3.3.3 but resolves its own copy, so the
  # renderer would load an unpatched sanitizer next to our patched one.
  dompurify@3: '>=3.4.17 <4' # renderer and Mermaid sanitizer
  # Both packaging tools and the Pi-compatible runtime consume these ranges.
  brace-expansion@1: '>=1.1.21 <2' # GHSA via minimatch@3
  brace-expansion@2: '>=2.1.7 <3' # GHSA via @electron/universal, jake
  brace-expansion@5: '>=5.0.12 <6' # GHSA via app-builder-lib and pi-coding-agent
  fast-uri@3: '>=3.1.8 <4' # GHSA via ajv@8
  undici@6: '>=6.28.1 <7' # GHSA via node-gyp@12
  undici@7: '>=7.29.1 <8' # pi-ai and Electron downloader
  js-yaml@4: '>=4.3.2 <5' # electron-updater and app-builder-lib
  '@xmldom/xmldom@0.8': '>=0.8.15 <0.9' # electron-builder plist parser
  '@xmldom/xmldom@0.9': '>=0.9.12 <0.10'
  http-cache-semantics@4: '>=4.3.0 <5' # Electron downloader cache policy
  source-map-js@1: '>=1.2.2 <2' # Vite/PostCSS
  vue@3: '>=3.5.42 <4' # VitePress server renderer
  vitest@4: '>=4.1.11 <5' # redirect-mock arbitrary file reads
  # rehype-katex 7 still requests 0.16; keep it and the renderer on the same
  # patched line. Math rendering and trust restrictions are regression-tested.
  # Pin the reviewed fix: 0.18.11 was deprecated for accidental breaking changes.
  katex@0.16: '0.18.2'
  # Docs site only. vitepress 1.6.4 asks for vite ^5.4.14 and no vite 5 is
  # patched — the fixes for all four advisories (server.fs.deny bypass, esbuild
  # dev-server CORS, optimized-deps `.map` traversal, launch-editor UNC) land in
  # 6.4.3. vitepress 2, which uses vite 6 itself, is still alpha, so this crosses
  # a major its parent has not declared. Verified against `docs:build` and
  # `docs:dev` (serves 200); drop it for vitepress 2 once that ships stable.
  vite@5: '>=6.4.3 <7'
# Drop this list once the pinned @earendil-works packages are older than
# pnpm's supply-chain age gate (packages published within the last day).
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.86.1'
  - '@earendil-works/pi-agent-core@0.86.1'
  - '@earendil-works/pi-ai@0.86.1'
  - '@earendil-works/pi-telemetry@0.86.1'
  - '@earendil-works/pi-coding-agent@0.86.1'
  - '@earendil-works/pi-tui@0.86.1'
patchedDependencies:
  '@earendil-works/pi-agent-core@0.86.1': patches/@earendil-works__pi-agent-core@0.86.1.patch
  '@earendil-works/pi-ai@0.86.1': patches/@earendil-works__pi-ai@0.86.1.patch
