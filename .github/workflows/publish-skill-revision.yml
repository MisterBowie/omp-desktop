name: Publish the accepted 0.1.2 Skill guidance revision

on:
  push:
    tags: ['publish-skill-v0.1.2-run-*']

permissions:
  contents: read
  actions: read

concurrency:
  group: omp-stable-publication
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.bind.outputs.revision }}
      run: ${{ steps.bind.outputs.run }}
      tag: ${{ steps.bind.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Bind the new source without moving the original stable release
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == MisterBowie/omp-desktop ]]
          [[ "$GITHUB_REF_NAME" =~ ^publish-skill-v0\.1\.2-run-([0-9]+)(-attempt-[0-9]+)?$ ]]
          source_run="${BASH_REMATCH[1]}"
          [[ "$(node -p "require('./app/package.json').version")" == 0.1.2 ]]
          revision="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run" --jq .head_sha)"
          [[ "$revision" == 6d4b0dcd18f0a2c3e315e3daf300941eafe2db01 ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/v0.1.2" --jq .sha)" == 21969e58f7d97177795ce06f393e8853c45cfb20 ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.2" --jq .id)" == 416884992 ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "run=$source_run" >> "$GITHUB_OUTPUT"
          echo "tag=v0.1.2+skill.$revision" >> "$GITHUB_OUTPUT"
  publish:
    needs: bind
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-publish.yml
    with:
      source-revision: ${{ needs.bind.outputs.revision }}
      artifact-run-id: ${{ needs.bind.outputs.run }}
      tag: ${{ needs.bind.outputs.tag }}
      same-version-revision: true
  readback:
    needs: [bind, publish]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/readback-published-release.yml
    with:
      source-revision: ${{ needs.bind.outputs.revision }}
      artifact-run-id: ${{ needs.bind.outputs.run }}
      tag: ${{ needs.bind.outputs.tag }}
