name: Classify native release failures without log disclosure

on:
  push:
    tags: ['diagnose-release-*']

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Read failed job logs without changing the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == MisterBowie/omp-desktop ]]
          [[ "$GITHUB_REF_NAME" =~ ^diagnose-release-([0-9]+)(-attempt-[0-9]+)?$ ]]
          source_run="${BASH_REMATCH[1]}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node -e 'for(const job of JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/jobs.json")).jobs)if(job.conclusion==="failure")console.log(job.id)' > "$RUNNER_TEMP/failed-jobs.txt"
          while read -r job; do
            [[ "$job" =~ ^[0-9]+$ ]]
            echo "::notice title=Failed job identifier::$job"
            if ! curl --fail --location --compressed --retry 2 --connect-timeout 10 --max-time 60 --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" --output "$RUNNER_TEMP/failed-job.log" 2> "$RUNNER_TEMP/log-access-error.txt"; then
              node -e 'const text=require("fs").readFileSync(process.env.RUNNER_TEMP+"/log-access-error.txt","utf8");const statuses=[400,401,403,404,410,422,429,500,502,503];const status=statuses.find(code=>text.includes(String(code)));const code=status?"HTTP_"+status:/TLS|SSL|certificate/i.test(text)?"TLS_ERROR":/timeout|timed out/i.test(text)?"NETWORK_TIMEOUT":"LOG_ACCESS_UNAVAILABLE";console.log("::notice title=Safe log access status::"+code);'
              continue
            fi
            node .github/scripts/identify-public-test-failures.mjs "$RUNNER_TEMP/failed-job.log"
            node app/scripts/classify-release-failure.mjs "$RUNNER_TEMP/failed-job.log"
            node .github/scripts/classify-publication-failure.mjs "$RUNNER_TEMP/failed-job.log"
          done < "$RUNNER_TEMP/failed-jobs.txt"
          if gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --pattern 'validation-*' --dir "$RUNNER_TEMP/native-validation" > "$RUNNER_TEMP/validation-access.txt" 2>&1; then
            node .github/scripts/summarize-validation.mjs "$RUNNER_TEMP/native-validation"
            # Annotations truncate long multi-platform summaries. Persist only
            # the same allowlisted fields, never raw validation files or logs.
            output="docs/validation/native-failure-$source_run.json"
            node --input-type=module -e 'import {writeFileSync} from "node:fs"; import {summarizeValidation} from "./.github/scripts/summarize-validation.mjs"; writeFileSync(process.argv[2],JSON.stringify(summarizeValidation(process.argv[1]),null,2)+"\n")' "$RUNNER_TEMP/native-validation" "$output"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$output"
            git commit -m "docs(validation): record bounded native failure facts" -m "Retain only the tested allowlist of public source coordinates, fixed categories and bounded outcomes. Raw logs remain on the runner."
            git push origin "HEAD:refs/heads/codex/native-diagnostic-${GITHUB_REF_NAME#diagnose-release-}"
          else
            echo '::notice title=Safe native validation summary::VALIDATION_DOWNLOAD_UNAVAILABLE'
          fi
