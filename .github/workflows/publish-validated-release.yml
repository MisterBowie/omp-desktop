name: Promote an accepted OMP candidate

on:
  push:
    tags: ['publish-v*-run-*']

permissions:
  contents: read
  actions: read

concurrency:
  group: omp-stable-publication
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.bind.outputs.revision }}
      run: ${{ steps.bind.outputs.run }}
      tag: ${{ steps.bind.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the immutable candidate selected by the publication tag
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == MisterBowie/omp-desktop ]]
          [[ "$GITHUB_REF_NAME" =~ ^publish-(v[0-9]+\.[0-9]+\.[0-9]+)-run-([0-9]+)(-attempt-[0-9]+)?$ ]]
          release_tag="${BASH_REMATCH[1]}"
          source_run="${BASH_REMATCH[2]}"
          [[ "$release_tag" == "v$(node -p "require('./app/package.json').version")" ]]
          revision="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run" --jq .head_sha)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "run=$source_run" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: bind
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-publish.yml
    with:
      source-revision: ${{ needs.bind.outputs.revision }}
      artifact-run-id: ${{ needs.bind.outputs.run }}
      tag: ${{ needs.bind.outputs.tag }}

  readback:
    needs: [bind, publish]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/readback-published-release.yml
    with:
      source-revision: ${{ needs.bind.outputs.revision }}
      artifact-run-id: ${{ needs.bind.outputs.run }}
      tag: ${{ needs.bind.outputs.tag }}
