name: Test accepted OMP candidate bug scenarios
on:
  push:
    tags: ['candidate-bug-check-v0.1.2-*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: app
jobs:
  windows:
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: 0.1.2
      RELEASE_REVISION: 21969e58f7d97177795ce06f393e8853c45cfb20
      CANDIDATE_RUN_ID: 39191848177
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Require the accepted product tree and immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == MisterBowie/omp-desktop ]]
          [[ "$(node -p "require('./package.json').version")" == 0.1.2 ]]
          [[ "$GITHUB_REF_NAME" == candidate-bug-check-v0.1.2-run-39191848177* ]]
          git diff --exit-code "$RELEASE_REVISION" HEAD -- apps/desktop/electron apps/desktop/src packages crates
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/candidate-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/candidate-artifacts.json"
          node scripts/verify-release-candidate.mjs "$RUNNER_TEMP/candidate-run.json" "$RUNNER_TEMP/candidate-jobs.json" "$RUNNER_TEMP/candidate-artifacts.json" "$RUNNER_TEMP/accepted-candidate.json"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:js
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.2.2
      - name: Download and verify the accepted Windows artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/accepted-candidate.json"));const a=r.artifacts.find(a=>a.name==="release-win32-x64");if(!a)process.exit(1);console.log(a.id)')"
          [[ "$artifact" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/accepted-windows.zip"
          python - <<'PYCODE'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path,PurePosixPath
          temporary=Path(os.environ['RUNNER_TEMP'])
          accepted=json.loads((temporary/'accepted-candidate.json').read_text())
          assert accepted['sourceRevision']==os.environ['RELEASE_REVISION']
          assert accepted['runId']==int(os.environ['CANDIDATE_RUN_ID'])
          artifact=next(a for a in accepted['artifacts'] if a['name']=='release-win32-x64')
          archive=temporary/'accepted-windows.zip'
          digest=hashlib.sha256()
          with archive.open('rb') as stream:
              for chunk in iter(lambda:stream.read(1024*1024),b''): digest.update(chunk)
          assert 'sha256:'+digest.hexdigest()==artifact['digest'],'candidate archive digest mismatch'
          output=Path('.artifacts/published-installer');output.mkdir(parents=True,exist_ok=True)
          name='OMP-Desktop-Setup-0.1.2.exe'
          with zipfile.ZipFile(archive) as bundle:
              matches=[i for i in bundle.infolist() if PurePosixPath(i.filename.replace(chr(92),'/')).name==name and not i.is_dir()]
              assert len(matches)==1,'expected exactly one candidate installer'
              assert 0<matches[0].file_size<1024**3,'invalid installer size'
              with bundle.open(matches[0]) as source,(output/name).open('wb') as target:
                  shutil.copyfileobj(source,target)
          installer=output/name
          selection={'version':'0.1.2','sourceRevision':accepted['sourceRevision'],'candidateRunId':accepted['runId'],'artifactDigest':artifact['digest'],'bytes':installer.stat().st_size,'sha256':hashlib.sha256(installer.read_bytes()).hexdigest()}
          (output/'selection.json').write_text(json.dumps(selection,indent=2)+'\n')
          print('Verified candidate archive digest and selected its exact Windows installer')
          PYCODE
      - name: Run isolated installed bug scenarios
        run: |
          export OMP_E2E_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          node scripts/e2e-released-bugs.mjs .artifacts/published-installer/OMP-Desktop-Setup-0.1.2.exe .artifacts/published-bug-checks
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-windows-bug-results
          if-no-files-found: error
          path: app/.artifacts/published-bug-checks/public-report.json
      - name: Publish only the bounded fixture result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -f .artifacts/published-bug-checks/public-report.json ]]
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('.artifacts/published-bug-checks/public-report.json'));
          assert.equal(r.version,'0.1.2');assert.equal(r.actualVersion,'0.1.2');assert.equal(r.platform,'win32');assert.equal(r.arch,'x64');
          const allowed=new Set(['WIN-FULLSCREEN-MAXIMIZED','WIN-TASKBAR-RESTORE','UTF16-HOST-READ','POWERSHELL-OUTPUT-EXIT','ORDERED-EXIT']);
          const number=n=>{assert(Number.isFinite(n)&&Math.abs(n)<1000000000);return n;};
          const rect=r=>Object.fromEntries(['x','y','width','height'].map(k=>[k,number(r[k])]));
          const checks=r.checks.map(c=>{
            assert(allowed.has(c.id));assert(['passed','failed'].includes(c.status));
            const out={id:c.id,status:c.status};
            if(c.status==='failed')return {...out,errorType:['Error','AssertionError','TypeError','HostRpcError'].includes(c.errorType)?c.errorType:'other'};
            const f=c.facts;
            if(c.id==='WIN-FULLSCREEN-MAXIMIZED')out.facts={colors:number(f.colors),bytes:number(f.bytes)};
            if(c.id==='WIN-TASKBAR-RESTORE')out.facts={bounds:rect(f.bounds),workArea:rect(f.workArea),maximized:f.maximized===true};
            if(c.id==='UTF16-HOST-READ')out.facts={preserved:f.preserved===true};
            if(c.id==='POWERSHELL-OUTPUT-EXIT')out.facts={outputPreserved:f.outputPreserved===true,exitCode:number(f.exitCode)};
            if(c.id==='ORDERED-EXIT')out.facts={noOwnedProcesses:f.noOwnedProcesses===true};
            return out;
          });
          assert.equal(new Set(checks.map(c=>c.id)).size,5);
          const safe={sourceRevision:process.env.RELEASE_REVISION,candidateRunId:Number(process.env.CANDIDATE_RUN_ID),version:r.version,platform:r.platform,arch:r.arch,monitorCount:number(r.monitorCount),dualMonitorQualified:r.dualMonitorQualified===true,cleaned:r.cleaned===true,checks};
          if(r.fullscreenObservation){const f=r.fullscreenObservation;safe.fullscreenObservation={maximized:f.maximized===true,painted:f.painted===true,colors:number(f.colors),bytes:number(f.bytes)};}
          if(r.restoreObservation){const f=r.restoreObservation;safe.restoreObservation={bounds:rect(f.bounds),workArea:rect(f.workArea),maximized:f.maximized===true};}
          writeFileSync(process.env.RUNNER_TEMP+'/safe-bug-result.json',JSON.stringify({message:'test: record accepted Windows candidate bug results',content:Buffer.from(JSON.stringify(safe,null,2)+'\n').toString('base64'),branch:'codex/published-bug-results-'+process.env.GITHUB_RUN_ID}));
          JS
          result_branch="codex/published-bug-results-$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$result_branch" -f sha="$GITHUB_SHA" --silent
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/docs/validation/Candidate-012-windows-$GITHUB_RUN_ID.json" --input "$RUNNER_TEMP/safe-bug-result.json" --silent
