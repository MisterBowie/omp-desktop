# macOS 预览打包（M5 试用产物）
#
# 用途：在没有 macOS 机器的前提下，用 GitHub Actions 的 macOS arm64 runner 产出
# 可直接试用的未签名 dmg/zip，并附加到既有 prerelease `m5-preview`。
#
# 与 app/.github/workflows/release.yml 的区别：本仓库根管理 docs/ 与 app/ 源码，
# 产品源码位于 app/，所以每一步都显式指定工作目录；本工作流不签名、不公证，
# 不发布 electron-updater 的 latest*.yml，也不改动版本号。
#
# 内置 OMP 运行时：与正式发布**同一入口**——`pnpm run dist:mac -- --arm64` 链尾的
# `scripts/release-package.mjs` 先跑 sidecar 预检（从自有 fork 的固定 commit 构建，
# 并对照 provenance / patch manifest 校验），只有预检通过才调用 electron-builder。
# 旧的预览做法已删除：下载上游发布资产、在 electron-builder 之后手工注入、
# 以及复制源码形态的工具门（它以相对 `../src/...` 导入，在 Resources 下无法
# 加载，运行时拒绝启动）。

name: macOS preview package

on:
  workflow_dispatch:
  push:
    branches: [codex/m5-tool-results]
    paths: [".github/workflows/mac-preview-package.yml"]

permissions:
  contents: write

jobs:
  mac-arm64:
    name: macOS arm64 unsigned preview
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # 未签名预览：不尝试查找 Developer ID，跳过 codesign，但仍产出 dmg/zip。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # 受控 sidecar 来源：自有 fork 的检出目录（见下面的 checkout）。
      OMP_SIDECAR_SOURCE: ${{ github.workspace }}/.omp-sidecar-source
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # 版本取自产品源码的 packageManager 字段（根目录没有 package.json）。
          package_json_file: app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Check out the pinned OMP sidecar fork
        uses: actions/checkout@v7
        with:
          # sidecar 由自有 fork 在清单固定的 commit 上编译；`fetch-depth: 0`
          # 是必须的：构建要用 `git diff <base> HEAD` 与
          # `git apply --check --reverse` 重新证明 HEAD == base + patch level。
          repository: MisterBowie/oh-my-pi
          ref: 512370a1b177cf45e4d12781104506ea372fb8a9
          path: .omp-sidecar-source
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install the pinned OMP fork dependencies
        working-directory: .omp-sidecar-source
        run: bun install --frozen-lockfile

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # dist:mac 自带 build:deps / build:host-release / bundle:runtime /
      # electron-vite build 与 sidecar 预检，这里不再重复这些步骤，也不在
      # electron-builder 之后触碰产物。
      - name: Package unsigned preview (sidecar preflight, then electron-builder)
        working-directory: app/apps/desktop
        run: pnpm run dist:mac -- --arm64

      - name: Stage assets
        working-directory: app/apps/desktop
        run: |
          set -euo pipefail
          mkdir -p ../../../.artifacts/mac-arm64
          out=../../../.artifacts/mac-arm64
          cp "release/PI-Desktop-0.15.2-arm64.dmg" "$out/OMP-Desktop-0.15.2-m5preview-mac-arm64.dmg"
          cp "release/PI-Desktop-0.15.2-arm64-mac.zip" "$out/OMP-Desktop-0.15.2-m5preview-mac-arm64.zip"
          (cd "$out" && shasum -a 256 ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload to release
        working-directory: app/apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload m5-preview \
            ../../../.artifacts/mac-arm64/OMP-Desktop-0.15.2-m5preview-mac-arm64.dmg \
            ../../../.artifacts/mac-arm64/OMP-Desktop-0.15.2-m5preview-mac-arm64.zip \
            ../../../.artifacts/mac-arm64/SHA256SUMS.txt \
            --clobber -R "$GITHUB_REPOSITORY"
          gh release view m5-preview -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
